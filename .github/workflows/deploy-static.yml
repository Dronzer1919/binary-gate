name: Build static site

# Builds the prerendered frontend and force-pushes it to the `deploy` branch, which Hostinger
# pulls straight into public_html (hPanel -> Git). No server-side build needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist/app/browser
          force_orphan: true
          enable_jekyll: false
